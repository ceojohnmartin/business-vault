# RALLY — publish the ISOLATED PREVIEW beside production on GitHub Pages.
#
# WHERE THIS FILE HAS TO LIVE. GitHub resolves a workflow by its file name
# on the DEFAULT branch: the Actions tab lists it from there, and the
# dispatch API answers 404 until it is there (proved 2026-09-15). So this
# one file must be on `main` — the file only, no app code — and it is
# written to be correct FROM main:
#
#   production   always the `main` branch's tree, byte for byte — checked
#                out fresh on every run, never built, edited or stamped
#   preview      always built from PREVIEW_REF (the Phase 5 branch by name,
#                overridable when run by hand), never from whatever branch
#                the workflow file happens to be on
#
# What one run publishes, as ONE Pages deployment:
#   /                      production, including /business-vault/rally/
#   /rally-preview/        the isolated preview: its own IndexedDB name, its
#                          own service-worker cache family, no cloud project,
#                          a demo team, a PREVIEW ribbon, and the Apple MapKit
#                          token from the repository secret MAPKIT_TOKEN,
#                          stamped into the OUTPUT only
#
# The token: read from `secrets.MAPKIT_TOKEN` into the build step's
# environment, written by rally/tools/build-preview.sh into the output's
# js/mapkit-config.js, and nowhere else. It is not in git, not in any commit
# (this workflow makes none), and GitHub masks it in logs. The served file is
# public by nature — a MapKit JS token always is — and Apple restricts it to
# the origin it was issued for.
#
# Pages source: this deploys with actions/deploy-pages, which requires the
# repository's Pages source to be "GitHub Actions" (Settings → Pages). With
# that set, a push to `main` runs THIS workflow (see `on: push`), so
# production keeps publishing itself on every push exactly as before — with
# the preview beside it. Switching the source back to "Deploy from a branch:
# main" restores the old mechanism at once and drops the preview. Nothing
# here is irreversible.
name: RALLY isolated preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_ref:
        description: "Branch to build /rally-preview/ from"
        required: false
        default: "claude/pest-sales-app-research-ba7u4n"

env:
  PREVIEW_REF: ${{ github.event.inputs.preview_ref || 'claude/pest-sales-app-research-ba7u4n' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Production site — the main branch, untouched
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Preview source — the Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
          path: src

      - name: Build the isolated preview into /rally-preview
        env:
          MAPKIT_TOKEN: ${{ secrets.MAPKIT_TOKEN }}
        run: |
          set -eu
          # the build script reads MAPKIT_TOKEN from its environment and
          # writes it into the output only; nothing below prints it
          sh src/rally/tools/build-preview.sh src/rally site/rally-preview p5
          echo "production = main @ $(git -C site rev-parse --short HEAD)"
          echo "preview    = $PREVIEW_REF @ $(git -C src rev-parse --short HEAD)"
          # THE PRODUCTION TREE IS MAIN'S OWN, UNTOUCHED. Asked of git, not of
          # a string search: the build must have written nothing under
          # site/ except site/rally-preview/ (a grep for the preview's names
          # would start failing the day this branch merges, since the build
          # script and its tests carry those names by design).
          changed="$(git -C site status --porcelain --untracked-files=all -- . ':(exclude)rally-preview' || true)"
          if [ -n "$changed" ]; then
            echo "the preview build altered production's tree:" >&2; echo "$changed" >&2; exit 1
          fi
          # …and if main carries the preview switch at all, it is the NULL one
          if [ -f site/rally/js/preview-config.js ]; then
            grep -q 'window.RALLY_PREVIEW = window.RALLY_PREVIEW || null;' site/rally/js/preview-config.js
          fi
          rm -rf site/.git site/.github
          test -f site/rally/index.html
          test -f site/rally-preview/index.html
          grep -q 'db: "rally-preview-p5"' site/rally-preview/js/preview-config.js
          grep -q 'isolated: true' site/rally-preview/js/preview-config.js
          echo "site ready"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}rally-preview/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
