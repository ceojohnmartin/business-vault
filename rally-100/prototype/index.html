<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RALLY 100 Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
<style>
/* RALLY 100 rep prototype. Layout: one phone-width column on a black field; RALLY black, white and gray, with RALLY green (#22B558, the Sold green of the RALLY sales app) used only for wins. */
:root{
  --bg:#0A0A0B; --surface:#131416; --surface2:#1B1C1F; --surface3:#26282C;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.22);
  --fg:#F4F5F8; --muted:#A7ACB8; --dim:#7A7F8C;
  --green:#22B558; --green-ink:#5BD98A; --green-soft:rgba(34,181,88,.16);
  --draft:#3A3C40; --alert:#F5B301;
  --ui:'Outfit','Helvetica Neue',Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.screen.home{gap:12px}
.screen.nonav{padding-block-end:calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:900;font-size:30px;line-height:1.08;letter-spacing:.01em}
h2{font-weight:800;font-size:20px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:13px}
.caps{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,10,11,.94);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1.5px #fff;flex:none;object-fit:cover}
.wm{font-weight:900;letter-spacing:.3em;font-size:15px;white-space:nowrap}
.pill{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);min-height:36px}

/* level line */
.lv{display:flex;flex-direction:column;gap:6px}
.lv-t{font-size:13px;color:var(--muted)}
.lv-t b{color:var(--fg);font-weight:700}
.xpbar{height:4px;background:var(--surface3);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:4px}

/* wall */
.wall{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;padding:10px;width:min(100%,max(200px,calc(100vh - 380px)));align-self:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.wall.frame{border-color:var(--green)}
.wall.dotgrid{background-image:radial-gradient(rgba(34,181,88,.24) 1px,transparent 1.3px);background-size:11px 11px}
.wall .stamp10{position:absolute;left:-9px;top:-9px;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--green);object-fit:cover}
.t{aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.t.draft{background:var(--draft);border-color:var(--draft)}
.t.held{background:repeating-linear-gradient(45deg,#44464c 0 3px,#24262A 3px 6px);border-color:#55575d}
.t.done{background:var(--green);border-color:var(--green)}
.t.ms::after{content:"";position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35)}
.t.ms-next{border-color:rgba(255,255,255,.75)}
.t.ms-next::after{background:#fff}
.t.sweep{background:var(--draft)}
.t.sweep::before{content:"";position:absolute;inset:0;background:var(--green);transform-origin:left;animation:sweep .2s ease-out both}
.t.popin{animation:popin .2s ease-out}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popin{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.wall-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.wall-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.2)}
.sw.done{background:var(--green);border-color:var(--green)}
.sw.draft{background:var(--draft);border-color:var(--draft)}
.sw.held{background:repeating-linear-gradient(45deg,#44464c 0 2px,#24262A 2px 4px)}

/* counter */
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-weight:600}
.labels{font-size:14px;margin-top:6px}
.sub{font-size:14px;color:var(--muted);margin-top:2px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-weight:700;font-size:16px;padding:0 18px;text-align:center}
.btn.primary{background:#fff;color:#0A0A0B;border-color:#fff}
.btn.primary[aria-disabled="true"]{opacity:.35}
.btn.ghost{border-color:transparent;color:var(--muted);min-height:44px}
.btn.danger{color:#ff8a8a;border-color:rgba(255,138,138,.35)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.link{background:none;border:0;padding:0 2px;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-weight:600;min-height:44px}
.pulse{animation:pulse 1s ease-in-out 1}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.12)}}

/* cards and chips */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.flat{background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.win{border-color:var(--green);color:var(--green-ink)}
.chip.draft{background:var(--draft);border-color:var(--draft);color:var(--fg)}
.chip.held{border-style:dashed}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.cbtn{border:1px solid var(--line2);background:var(--surface2);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px;font-weight:600;white-space:nowrap}
.cbtn.on{background:#fff;color:#0A0A0B;border-color:#fff}

/* strip and rewards */
.strip{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface2);display:flex;gap:12px;align-items:flex-start;font-size:15px}
.strip.win{border-color:var(--green)}
.stamp{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2.5px var(--green);flex:none;object-fit:cover}
.rw-row{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.rw-row:first-of-type{border-top:0;padding-top:0}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks div{display:flex;gap:10px;align-items:center}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ck.on{background:var(--green);border-color:var(--green)}
.ck svg{width:12px;height:12px}
.totals{font-size:14px;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.nav button.on{color:#fff}
.nav svg{width:22px;height:22px}

/* scenes */
.scene-card{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.scene-card .nm{font-weight:800;font-size:18px}
.scene-card.sm{padding:12px 14px}
.scene-card.sm .nm{font-size:16px}
.scene-card.locked{opacity:.5}
.scene-card .ft{font-size:12px;color:var(--dim)}
.cleared{color:var(--green-ink);font-weight:700}
.pin-card{border-color:var(--line2);background:var(--surface2)}

/* sprint */
.sp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp-count{font-weight:700;font-variant-numeric:tabular-nums}
.sp-line{font-size:20px;line-height:1.3;font-weight:600}
.miniwall{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.miniwall .t{width:18px;height:18px;aspect-ratio:auto;border-radius:4px}
.sp-form{display:flex;gap:8px}
.sp-form input{flex:1;min-width:0;min-height:56px;border-radius:14px;border:1px solid var(--line2);background:var(--surface2);padding:0 16px;font-size:18px}
.sp-form .btn{width:auto;flex:none;min-width:84px}
.flash{box-shadow:0 0 0 2px var(--green) inset}
.savedcheck{color:var(--green-ink);font-weight:700;font-size:14px;min-height:20px}
.pinned{border:1px solid #fff;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
.cue{border:1px dashed var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.lastnames{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.endsheet{border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2);padding:16px;display:flex;flex-direction:column;gap:10px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.field input,.field textarea{min-height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);padding:12px 14px;font-size:17px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field.missing input{border-color:#fff}
.field .err{font-size:13px;color:var(--alert);min-height:0}
.hand{display:flex;gap:8px;align-items:center}
.hand span{font-weight:700;color:var(--muted)}
.collapsed{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.banner{border:1px solid var(--alert);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.share{font-size:13px;color:var(--dim)}

/* network */
.search{min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);padding:0 14px;font-size:16px;width:100%}
.ncard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ncard .top-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ncard .nm{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.74);padding:24px}
.cele{background:var(--surface);border:1px solid var(--green);border-radius:22px;padding:26px 22px;text-align:center;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;animation:celein .25s ease-out}
.cele img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px var(--green);object-fit:cover;animation:stampin .35s ease-out}
.cele .ct{font-weight:900;font-size:24px}
.cele .tap{font-size:12px;color:var(--dim)}
.bigcheck{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.bigcheck svg{width:34px;height:34px}
@keyframes celein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes stampin{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-wrap{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;animation:celein .2s ease-out}
.toast.win{border-color:var(--green);color:var(--green-ink)}
.shake{animation:shake .3s ease-in-out}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px calc(28px + env(safe-area-inset-bottom,0px))}
.ob .hero{display:flex;align-items:center;gap:12px}
.ob .hero img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px #fff;object-fit:cover}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:4px;background:var(--surface3)}
.dots i.on{background:#fff}
.lines{display:flex;flex-direction:column;gap:10px;font-size:17px}
.lines div{border-left:2px solid var(--line2);padding-left:12px}
.ackrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line2);border-radius:14px;padding:14px;font-size:15px;cursor:pointer}
.ackrow input{width:22px;height:22px;margin:2px 0 0;accent-color:#fff;flex:none}
.proto-note{font-size:13px;color:var(--dim);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px}

/* congrats */
.cg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.cg-wall{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:300px}
.cg-wall i{aspect-ratio:1;border-radius:4px;background:var(--green);animation:ripple .35s ease-out both}
@keyframes ripple{from{transform:scale(.4);opacity:.2}to{transform:scale(1);opacity:1}}
.cg img{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 3px var(--green);object-fit:cover;margin-top:-56px;animation:stampin .4s ease-out .5s both}
.ruled{display:flex;align-items:center;gap:12px;width:100%;font-weight:800;letter-spacing:.3em;font-size:15px}
.ruled::before,.ruled::after{content:"";flex:1;height:1px;background:var(--line2)}
.cg .msg{font-size:20px;font-weight:700;line-height:1.35}
.facts{width:100%;text-align:left;font-size:15px}
.facts div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
html.rm *{animation:none!important;transition:none!important}
@media (min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>

<div class="toasts" id="toasts" aria-live="polite"></div>

/* ---------- state ---------- */
function fresh(){return {v:1,ack:false,entries:[],nextId:1,xp:0,xpKeys:{},ms:{},cos:{},scenes:{},lastScene:null,firstSprint:true,reward:{status:'progress',readyAt:null,approvedAt:null,paidAt:null},referrals:[],badges:{},rm:false,sample:false,levelName:'Rookie'};}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&s.v===1){var f=fresh();for(var k in f){if(!(k in s))s[k]=f[k];}return s;}}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
var st=load();

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normPhone(s){var d=String(s||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d;}
function phoneOk(d){return /^\d{10}$/.test(d||'');}
function fmtPhone(d){return phoneOk(d)?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):d;}
function normHandle(s){return String(s||'').trim().toLowerCase().replace(/^https?:\/\/(www\.)?[^\/]+\//,'').replace(/^@/,'').replace(/[\/?#].*$/,'');}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch(e){return '';}}
function byId(id){for(var i=0;i<st.entries.length;i++){if(st.entries[i].id===id)return st.entries[i];}return null;}
function sceneById(id){for(var i=0;i<SCENES.length;i++){if(SCENES[i].id===id)return SCENES[i];}return null;}
function fullName(e){return (e.first+(e.last?' '+e.last:'')).trim();}
function missing(e){var m=[];if(!e.last)m.push('Last name');if(!phoneOk(e.phone))m.push('Phone');if(!e.handle||!e.platform||(e.platform==='Other'&&!e.otherApp))m.push('Social handle');return m;}
function isComplete(e){return !!e.first&&missing(e).length===0;}
function counted(e){return !e.removed&&!e.heldOf&&isComplete(e);}
function live(){return st.entries.filter(function(e){return !e.removed;});}
function count(){return st.entries.filter(counted).length;}
function drafts(){return st.entries.filter(function(e){return !e.removed&&!e.heldOf&&!isComplete(e);});}
function heldList(){return st.entries.filter(function(e){return !e.removed&&e.heldOf;});}
function personKey(e){return e.xpKey||('p:'+e.phone);}
function handleKey(e){return e.handle&&e.platform?e.platform+':'+(e.platform==='Other'?String(e.otherApp||'').toLowerCase()+':':'')+normHandle(e.handle):null;}
function level(){var cur=LEVELS[0],nxt=LEVELS[1];for(var i=0;i<LEVELS.length;i++){if(st.xp>=LEVELS[i][1]){cur=LEVELS[i];nxt=LEVELS[i+1]||null;}}return {name:cur[0],min:cur[1],next:nxt};}
function sceneStats(sid){var es=live().filter(function(e){return e.scene===sid;});var lit=es.filter(counted).length;var dr=es.filter(function(e){return !e.heldOf&&!isComplete(e);}).length;return {names:es.length,lit:lit,drafts:dr};}
function nextMs(c){for(var i=0;i<MS.length;i++){if(MS[i]>c)return MS[i];}return null;}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'));}

 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',

var app=document.getElementById('app');
var view={name:st.ack?'home':'onboarding',p:{step:0}};
var fx={done:{},drafted:{}};
var after={};
function go(name,p){stopSprint();view={name:name,p:p||{}};render();try{window.scrollTo(0,0);}catch(e){}}
function render(){document.documentElement.classList.toggle('rm',!!st.rm);app.innerHTML=(SCREENS[view.name]||SCREENS.home)(view.p);if(after[view.name])after[view.name](view.p);fx={done:{},drafted:{}};}
function topbar(){return '<header class="top"><div class="top-in"><div class="brand"><img class="mark" src="'+PANTHER+'" alt="RALLY MKTG panther" width="28" height="28"><span class="wm">RALLY 100</span></div><button class="pill" data-a="proto" aria-label="Open prototype controls">Prototype</button></div></header>';}
function nav(active){var items=[['home','Home'],['scenes','Scenes'],['network','Network'],['rewards','Rewards']];return '<nav class="nav" aria-label="Main"><div class="nav-in">'+items.map(function(it){var on=it[0]===active;return '<button data-a="tab" data-k="'+it[0]+'" class="'+(on?'on':'')+'"'+(on?' aria-current="page"':'')+'>'+ICON[it[0]]+'<span>'+it[1]+'</span></button>';}).join('')+'</div></nav>';}
function stampImg(cls){return '<img class="'+(cls||'stamp')+'" src="'+PANTHER+'" alt="RALLY panther stamp">';}

function wallHTML(){
  var c=count();
  var done=st.entries.filter(counted).sort(function(a,b){return a.completedAt-b.completedAt;});
  var held=heldList(), dr=drafts().sort(function(a,b){return a.created-b.created;});
  var order=done.map(function(e){return ['done',e];}).concat(held.map(function(e){return ['held',e];}),dr.map(function(e){return ['draft',e];})).slice(0,100);
  var nm=nextMs(c),cells=[];
  for(var i=0;i<100;i++){
    var o=order[i],cls='t';
    if(o){cls+=' '+o[0];if(o[0]==='done'&&fx.done[o[1].id])cls+=' sweep';if(o[0]==='draft'&&fx.drafted[o[1].id])cls+=' popin';}
    else{if(i===9||i===24||i===49||i===74)cls+=' ms';if(nm&&i===nm-1)cls+=' ms-next';}
    cells.push('<div class="'+cls+'"></div>');
  }
  var wcls='wall'+(st.cos[25]?' frame':'')+(st.cos[50]?' dotgrid':'');
  return '<div class="'+wcls+'" data-a="wall" role="img" aria-label="Your Wall: '+Math.min(c,100)+' of 100 tiles lit">'+(st.cos[10]?'<img class="stamp10" src="'+PANTHER+'" alt="">':'')+cells.join('')+'</div>';
}
function legendHTML(){return '<div class="wall-legend" aria-hidden="true"><span><i class="sw done"></i>Complete, counts</span><span><i class="sw draft"></i>Draft, doesn’t count yet</span><span><i class="sw held"></i>Check: possible duplicate</span></div>';}
function subline(c,ds){
  if(st.reward.status==='ready'&&c<100)return c+'/100. List reward: Ready for review, on hold until you’re back at 100. Nothing was lost.';
  if(c>=100)return 'Wall complete.';
  if(c===0&&!ds.length)return 'Your Wall is dark. Enter a Scene: a short memory prompt from one part of your life.';
  if(c===99)return '99/100, 1 more to complete your list.';
  if(c>=75)return (100-c)+' to go.'+(ds.length?' Finish your '+plural(ds.length,'draft')+' and you’re at '+Math.min(100,c+ds.length)+'.':'');
  var one=ds.filter(function(e){return missing(e).length===1;}).length,nm=nextMs(c),parts=[];
  if(one)parts.push(one+(one===1?' draft is':' drafts are')+' one field away');
  parts.push((nm-c)+' more until your next milestone ('+nm+')');
  return parts.join(' | ');
}
function nextAction(){
  var c=count(),ds=drafts();
  if(c>=100&&st.reward.status==='ready')return {label:'Show your leader',a:'congrats'};
  if(c>=100)return {label:'Introduce someone',a:'intro-stub'};
  var one=ds.filter(function(e){return missing(e).length===1;}).length,nm=nextMs(c);
  if(ds.length>=3||(one>0&&c+one>=nm)){var mins=Math.max(1,Math.round(ds.length*20/60));return {label:'Finish '+plural(ds.length,'draft')+' ('+mins+' min)',a:'sweep-all'};}
  if(st.lastScene&&sceneStats(st.lastScene).names<5){var sc=sceneById(st.lastScene);return {label:'Continue: '+sc.name,a:'scene-open',sid:sc.id};}
  return {label:'Enter a Scene',a:'tab',k:'scenes'};
}
function stripHTML(){
  var c=count(),r=st.reward;
  if(r.status==='paid')return '<div class="strip win">'+stampImg()+'<div><b>List reward: $100.</b> Pay issued '+fmtDate(r.paidAt)+'.</div></div>';
  if(r.status==='approved')return '<div class="strip win">'+stampImg()+'<div><b>List reward: $100 · Pending pay.</b> Nothing needed from you. RALLY pays you directly and marks it Pay issued here.</div></div>';
  if(r.status==='ready'&&c>=100)return '<div class="strip win"><div><b>100/100 complete.</b> Congratulations! Show this to your leader and walk through your list and signed friends together to confirm your prize!</div></div>';
  if(r.status==='ready')return '<div class="strip"><div>'+c+'/100. List reward: Ready for review, on hold until you’re back at 100. Nothing was lost.</div></div>';
  return '<div class="strip" data-a="tab" data-k="rewards"><div><div>List reward: In progress.</div><div class="muted">Complete your 100 list to qualify for the $100 completion reward.</div></div></div>';
}
function incentivesHTML(){return '<section class="card flat"><div class="caps">Incentives</div><p class="muted">Incentives from RALLY show up here, each with a picture, name and prize.</p></section>';}
function badgesHTML(){return '<section class="card flat"><div class="caps">Badges · game only, never cash</div><div class="chips">'+BADGES.map(function(b){var on=!!st.badges[b[0]];return '<span class="chip'+(on?' win':'')+'" title="'+esc(b[2])+'">'+esc(b[1])+'</span>';}).join('')+'</div></section>';}

/* onboarding */
SCREENS.onboarding=function(p){
  var step=p.step||0,dots='<div class="dots" aria-label="Card '+(step+1)+' of 4">'+[0,1,2,3].map(function(i){return '<i class="'+(i===step?'on':'')+'"></i>';}).join('')+'</div>';
  var hero='<div class="hero"><img src="'+PANTHER+'" alt="RALLY MKTG panther"><span class="wm">RALLY 100</span></div>';
  var body='';
  if(step===0)body='<h1>Build your 100 list.</h1><p class="lines"><span>100 real people you know. Nobody has to want a job. You build it in Scenes: short memory prompts from one part of your life. Each person lights one tile on your Wall.</span></p><p class="proto-note">Prototype: everything you type stays on this phone. Nothing is sent to RALLY.</p>';
  if(step===1)body='<h1>Your rewards</h1><div class="lines"><div>Finish all 100: $100. One time.</div><div>Each friend you introduce who gets all four checks: $100. Each friend counts once.</div><div>The four checks: Meeting completed, Commitment confirmed, Agreement signed, Start date and travel plans confirmed (where travel applies).</div><div>When you finish, you and your leader walk through your list and signed friends together. Your leader approves your prize, then RALLY records it as paid.</div></div>';
  if(step===2)body='<h1>What counts</h1><div class="lines"><div>A contact counts with all four: first name, last name, one social handle with the app named, phone number.</div><div>Save names first, add details later. Drafts are kept but don’t count.</div></div>';
  if(step===3)body='<h1>Who sees your contacts</h1><p class="lines"><span>Every contact you save, including drafts, is visible to your leader and the RALLY recruiting team the moment you save it, not at 100. The RALLY recruiting team may contact people you introduce. Other reps never see your list.</span></p><label class="ackrow" id="ackRow"><input type="checkbox" id="ackBox"'+(p.ack?' checked':'')+'><span>I understand my contacts are shared with the RALLY recruiting team.</span></label><p class="small muted" id="ackHint"></p><p class="proto-note">In this prototype nothing leaves your phone. In the real app, this is how sharing works.</p>';
  var btns=step<3?'<div class="row">'+(step>0?'<button class="btn" data-a="ob-back">Back</button>':'')+'<button class="btn primary" data-a="ob-next">Next</button></div>':'<div class="row"><button class="btn" data-a="ob-back">Back</button><button class="btn primary" data-a="ob-go" id="obGo" aria-disabled="'+(p.ack?'false':'true')+'">Light the Wall</button></div>';
  return '<main class="ob">'+hero+dots+body+'<div style="flex:1"></div>'+btns+'</main>';
};
after.onboarding=function(p){var b=document.getElementById('ackBox');if(b)b.addEventListener('change',function(){p.ack=b.checked;var g=document.getElementById('obGo');if(g)g.setAttribute('aria-disabled',b.checked?'false':'true');var h=document.getElementById('ackHint');if(h)h.textContent='';});};

/* home */
SCREENS.home=function(){
  var c=count(),ds=drafts(),hd=heldList(),lv=level(),na=nextAction();
  var span=lv.next?lv.next[1]-lv.min:1,pct=lv.next?Math.round((st.xp-lv.min)/span*100):100;
  var labels=Math.min(c,100)+' lit'+(ds.length?' | '+plural(ds.length,'draft'):'')+(hd.length?' | '+hd.length+' to check':'');
  var over=c>100?'<p class="small muted">Overflow +'+(c-100)+'. Extra contacts help you make more introductions. The list reward is one-time.</p>':'';
  var ret='';
  if(st.lastScene&&c<100){var s=sceneStats(st.lastScene),sc=sceneById(st.lastScene);ret='<p class="small muted">Last scene: '+esc(sc.name)+'. '+s.lit+' lit, '+plural(s.drafts,'draft')+' left. Pick up where you left off.</p>';}
  var naAttr='data-a="'+na.a+'"'+(na.sid?' data-sid="'+na.sid+'"':'')+(na.k?' data-k="'+na.k+'"':'');
  var lvl='<div class="lv"><div class="lv-t"><b>'+lv.name+'</b> \u00b7 '+st.xp+' XP'+(lv.next?' \u00b7 '+(lv.next[1]-st.xp)+' to '+lv.next[0]:'')+'</div><div class="xpbar"><i style="width:'+pct+'%"></i></div></div>';
  return topbar()+'<main class="screen home">'+
   wallHTML()+
   '<div><div class="big"><b>'+Math.min(c,100)+'</b><span>/100 contacts complete</span></div><div class="labels">'+labels+(st.sample?' <span class="chip" style="margin-left:4px">Sample data</span>':'')+'</div><div class="sub">'+esc(subline(c,ds))+'</div>'+over+'</div>'+
   '<button class="btn primary" '+naAttr+'>'+esc(na.label)+'</button>'+ret+lvl+legendHTML()+
   stripHTML()+incentivesHTML()+badgesHTML()+
  '</main>'+nav('home');
};

/* scenes */
SCREENS.scenes=function(){
  var c=count(),ds=drafts();
  var pinned=ds.length>=5?'<button class="scene-card pin-card" data-a="sweep-all"><span class="nm">Light the Drafts</span><span class="muted">'+ds.length+' drafts, most missing one field. Knock them out.</span></button>':'';
  function card(sc,small){
    var s=sceneStats(sc.id),locked=sc.unlock&&c<sc.unlock;
    var stat=locked?'Unlocks at '+sc.unlock+' complete contacts':(s.names?s.lit+' lit · '+plural(s.drafts,'draft'):'not started');
    var cleared=st.scenes[sc.id]&&st.scenes[sc.id].cleared?' · <span class="cleared">Cleared</span>':'';
    return '<button class="scene-card'+(small?' sm':'')+(locked?' locked':'')+'" data-a="'+(locked?'locked':'scene-open')+'" data-sid="'+sc.id+'"><span class="nm">'+esc(sc.name)+' <span class="dim small">· '+stat+'</span>'+cleared+'</span>'+(small?'':'<span class="muted">'+esc(sc.line)+'</span>')+'<span class="ft">'+sc.clears+' names clears this scene. No limit.'+(sc.note?' '+esc(sc.note):'')+'</span></button>';
  }
  return topbar()+'<main class="screen"><div><h1>Scenes</h1><p class="muted">Pick a scene. Skip any that aren’t you.</p><p class="small dim">'+Math.min(c,100)+'/100 · '+plural(ds.length,'draft')+'</p></div>'+pinned+
   SCENES.slice(0,3).map(function(s){return card(s,false);}).join('')+'<div class="caps">All scenes</div>'+SCENES.slice(3).map(function(s){return card(s,true);}).join('')+'</main>'+nav('scenes');
};

SCREENS.dropin=function(p){

  var extra='';

   '<p class="sp-line" id="spLine">'+esc(sc.line)+'</p><div class="miniwall" id="miniWall" aria-hidden="true"></div><div class="lastnames" id="lastNames"></div>'+

after.sprint=function(p){
  var sc=sceneById(p.sid);
  sp={sid:p.sid,mode:p.mode,left:p.mode==='timed'?60:null,names:[],timer:null,pinned:null,rung:0,chainHits:0,paused:false,idle:null,ended:false};

  if(view.name==='sweep'){view.p.i++;render();}else render();
}
function removeEntry(id){var e=byId(id);if(!e)return;var before=count();e.removed=true;e.removedAt=Date.now();st.entries.forEach(function(x){if(x.heldOf===e.id){x._wasCounted=false;x.heldOf=null;commit(x);delete x._wasCounted;}});afterCount(before);save();closeSheet();toast('Removed. Your count is '+Math.min(count(),100)+'.');go('network');}
function restoreEntry(id){var e=byId(id);if(!e)return;e.removed=false;e._wasCounted=false;commit(e);delete e._wasCounted;toast(e.heldOf?'Restored. Check: possible duplicate.':'Restored. No XP the second time.');render();}

/* network */
SCREENS.network=function(p){
  var f=p.f||'all',all=live(),c=count(),ds=drafts(),hd=heldList(),removed=st.entries.filter(function(e){return e.removed&&!e.mergedInto;});
  var filters=[['all','All'],['done','Complete'],['draft','Drafts'],['held','To check'],['removed','Removed']];
  return topbar()+'<main class="screen"><div class="sp-top"><h1>My Network</h1><button class="btn sm" style="width:auto" data-a="net-add">+ Add</button></div>'+
   '<p class="small muted">'+c+' complete · '+plural(ds.length,'draft')+' · '+hd.length+' to check</p>'+
   '<label class="sr" for="netSearch">Search contacts</label><input class="search" id="netSearch" placeholder="Search by name, phone or handle" value="'+esc(p.q||'')+'">'+
   '<div class="chips scroll">'+filters.map(function(x){return '<button class="cbtn'+(f===x[0]?' on':'')+'" data-a="net-filter" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div><div id="netList" style="display:flex;flex-direction:column;gap:8px"></div></main>'+nav('network');
};
after.network=function(p){var s=document.getElementById('netSearch');s.addEventListener('input',function(){p.q=s.value;netList(p);});netList(p);};
function netList(p){
  var f=p.f||'all',q=(p.q||'').trim().toLowerCase(),qd=q.replace(/\D/g,'');
  var list=(f==='removed'?st.entries.filter(function(e){return e.removed&&!e.mergedInto;}):live()).filter(function(e){
    if(f==='done'&&!counted(e))return false;if(f==='draft'&&(e.heldOf||isComplete(e)))return false;if(f==='held'&&!e.heldOf)return false;
    if(!q)return true;return fullName(e).toLowerCase().indexOf(q)>=0||(qd.length>=3&&e.phone.indexOf(qd)>=0)||normHandle(e.handle).indexOf(q.replace(/^@/,''))>=0;
  }).sort(function(a,b){return b.created-a.created;});
  var box=document.getElementById('netList');if(!box)return;
  if(!list.length){box.innerHTML='<p class="muted">'+(live().length?'Nothing matches.':'No contacts yet. Enter a Scene to start your Wall.')+'</p>';return;}
  box.innerHTML=list.slice(0,200).map(function(e){var sc=e.scene?sceneById(e.scene):null,o=e.heldOf?byId(e.heldOf):null;
    var line=o?'Might be the same person as '+esc(fullName(o)):(isComplete(e)?(e.tags.length?esc(e.tags.join(', ')):(sc?esc(sc.name):'')):'Missing: '+missing(e).join(', '));
    return '<button class="ncard" data-a="net-open" data-id="'+e.id+'"><span class="top-row"><span class="nm">'+esc(fullName(e))+'</span>'+statusChip(e)+'</span><span class="small muted">'+line+'</span><span class="small dim">Added '+fmtDate(e.created)+(e.keptWith&&e.keptWith.length?' · Kept both':'')+'</span></button>';}).join('');
}

/* rewards */
SCREENS.rewards=function(){
  var c=count(),r=st.reward,line='',chip='';
  if(r.status==='paid'){chip='<span class="chip win">Pay issued</span>';line='List reward: $100. Pay issued '+fmtDate(r.paidAt)+'.';}
  else if(r.status==='approved'){chip='<span class="chip win">Pending pay</span>';line='List reward: $100 · Pending pay. Nothing needed from you. RALLY pays you directly and marks it Pay issued here.';}
  else if(r.status==='ready'&&c>=100){chip='<span class="chip">Ready for review</span>';line='100/100 complete. Congratulations! Show this to your leader and walk through your list and signed friends together to confirm your prize!';}
  else if(r.status==='ready'){chip='<span class="chip">On hold ('+c+'/100)</span>';line=c+'/100. List reward: Ready for review, on hold until you’re back at 100. Nothing was lost.';}
  else{chip='<span class="chip">In progress</span>';line=Math.min(c,100)+'/100 contacts complete. Complete your 100 list to qualify for the $100 completion reward.';}
  var stamped=r.status==='approved'||r.status==='paid';
  var pend=0,paid=0;if(r.status==='approved')pend+=100;if(r.status==='paid')paid+=100;
  st.referrals.forEach(function(x){if(x.status==='approved')pend+=100;if(x.status==='paid')paid+=100;});
  var refs=st.referrals.length?st.referrals.map(refRow).join(''):'<p class="muted">Friends you introduce show up here once they’re on your Intro Board.</p>';
  return topbar()+'<main class="screen"><h1>My Rewards</h1>'+
   '<section class="card'+(stamped?' win':'')+'" style="'+(stamped?'border-color:var(--green)':'')+'"><div class="sp-top"><h2>List Completion Reward · $100</h2>'+chip+'</div><div style="display:flex;gap:12px;align-items:flex-start">'+(stamped?stampImg():'')+'<p>'+esc(line)+'</p></div>'+(r.status==='ready'&&c>=100?'<button class="btn primary" data-a="congrats">Show your leader</button>':'')+'</section>'+
   '<section class="card"><div class="sp-top"><h2>Referral rewards</h2></div><p class="muted">Referral rewards: $100 per qualifying friend.</p>'+refs+'</section>'+
   ((pend||paid)?'<p class="totals">Pending pay: $'+pend+' · Pay issued: $'+paid+'</p>':'')+
   '<section class="card flat"><div class="caps">Incentives</div><p class="muted">Incentives from RALLY show up here, each with a picture, name and prize.</p></section>'+
   '<p class="small dim">‘Pay issued’ means RALLY marked your pay as sent on that date. This app doesn’t send money. RALLY pays you directly.</p></main>'+nav('rewards');
};
function refRow(x){
  var n=x.checks.filter(function(k){return k.on;}).length,still=CHECK_NAMES.filter(function(_,i){return !x.checks[i].on;}),txt;
  if(x.status==='paid')txt=x.name+': $100. Pay issued '+fmtDate(x.paidAt)+'.';
  else if(x.status==='approved')txt=x.name+': Referral reward $100 · Pending pay. Nothing needed from you.';
  else if(n===4)txt=x.name+': 4 of 4 confirmed. Congratulations! Show this to your leader to confirm your prize!';
  else txt=x.name+': '+n+' of 4 confirmed. Still needed: '+still.join(', ')+'. Next action: Leader Dana.';
  var stamped=x.status==='approved'||x.status==='paid';
  return '<div class="rw-row"><div style="display:flex;gap:12px;align-items:flex-start">'+(stamped?stampImg():'')+'<p>'+esc(txt)+'</p></div><div class="checks">'+x.checks.map(function(k,i){return '<div><span class="ck'+(k.on?' on':'')+'">'+(k.on?ICON.check:'')+'</span><span>'+CHECK_NAMES[i]+(k.on?' <span class="dim">· '+esc(k.by)+', '+fmtDate(k.at)+'</span>':' <span class="dim">· Not yet</span>')+'</span></div>';}).join('')+'</div></div>';
}

/* congrats */
SCREENS.congrats=function(p){
  var c=count(),signed=st.referrals.filter(function(x){return x.checks.every(function(k){return k.on;});});
  var tiles='';for(var i=0;i<100;i++)tiles+='<i style="animation-delay:'+(p.fresh?i*7:0)+'ms"></i>';
  return '<main class="screen nonav"><div class="cg"><div class="cg-wall" aria-hidden="true">'+tiles+'</div><img src="'+PANTHER+'" alt="RALLY panther stamp"><div class="ruled">WALL COMPLETE</div>'+
   '<p class="msg">100/100 complete. Congratulations! Show this to your leader and walk through your list and signed friends together to confirm your prize!</p>'+
   '<div class="facts card"><div style="border-top:0"><span class="muted">Finished</span><span>'+fmtDate(st.reward.readyAt||Date.now())+'</span></div><div><span class="muted">Complete contacts</span><span>'+c+'</span></div><div><span class="muted">Signed friends</span><span>'+(signed.length?esc(signed.map(function(x){return x.name;}).join(', ')):'None yet')+'</span></div><div><span class="muted">List reward</span><span>'+(st.reward.status==='approved'?'Pending pay':st.reward.status==='paid'?'Pay issued':'Ready for review')+'</span></div></div>'+
   '<button class="btn primary" data-a="tab" data-k="home">Done</button><p class="small dim">Prototype: use Prototype controls to play the leader approving and RALLY marking pay issued.</p></div></main>';
};

/* ---------- overlays ---------- */
var celeQ=[],celeOn=false;
function queueCele(c){celeQ.push(c);if(!celeOn){celeOn=true;setTimeout(nextCele,250);}}
function nextCele(){
  var c=celeQ.shift();if(!c){celeOn=false;return;}celeOn=true;
  var el=document.createElement('div');el.className='overlay';el.setAttribute('role','status');
  el.innerHTML='<div class="cele">'+(c.stamp?'<img src="'+PANTHER+'" alt="">':'')+(c.check?'<div class="bigcheck">'+ICON.check+'</div>':'')+'<div class="ct">'+esc(c.title)+'</div>'+(c.sub?'<p class="muted">'+esc(c.sub)+'</p>':'')+'<div class="tap">Tap to continue</div></div>';
  var gone=false;function done(){if(gone)return;gone=true;el.remove();nextCele();}
  el.addEventListener('click',done);document.body.appendChild(el);setTimeout(done,1450);
}
function toast(msg,kind){var box=document.getElementById('toasts'),t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.textContent=msg;box.appendChild(t);setTimeout(function(){t.remove();},1800);}
function openSheet(html){closeSheet();var w=document.createElement('div');w.className='sheet-wrap';w.id='sheetWrap';w.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';w.addEventListener('click',function(ev){if(ev.target===w)closeSheet();});document.body.appendChild(w);}
function closeSheet(){var w=document.getElementById('sheetWrap');if(w)w.remove();}
function openProto(){
  var r=st.reward;
  openSheet('<h2>Prototype controls</h2><p class="small muted">Not part of the real app. Everything here stays on this phone.</p>'+
   '<button class="btn" data-a="p-sample">Load a sample list (42 contacts)</button>'+
   '<button class="btn" data-a="p-jump">Jump to 99 contacts</button>'+
   '<button class="btn" data-a="p-approve">Leader approves at the walkthrough</button>'+
   '<button class="btn" data-a="p-pay">Owner marks pay issued</button>'+
   (r.status!=='progress'?'<button class="btn" data-a="p-congrats">Show the congratulations screen</button>':'')+
   '<button class="btn" data-a="p-rm">Reduce motion: '+(st.rm?'On':'Off (follows phone)')+'</button>'+
   '<button class="btn danger" data-a="p-reset">Reset everything</button><button class="btn ghost" data-a="sheet-close">Close</button>');
}

/* ---------- sample data ---------- */
var FN=['Marcus','Jordan','Priya','Kayla','Andre','Sofia','Devin','Maya','Luis','Hannah','Isaiah','Brooke','Mateo','Jasmine','Caleb','Aaliyah','Ethan','Nia','Gabe','Olivia','Trey','Camila','Noah','Zoe','Elijah','Ava','Xavier','Lily','Jalen','Grace','Diego','Emma','Malik','Chloe','Owen','Riley','Cole','Sara','Bryce','Leah','Jace','Mia','Aiden','Nora','Ryan','Ella','Kai','Ruby','Tyrese','Ivy'];
var LN=['Lee','Shah','Lee','Nguyen','Walker','Castillo','Brooks','Patel','Rivera','Kim','Bennett','Hayes','Reed','Flores','Price','Cruz','Foster','Ward','Diaz','Grant','Hughes','Long','Ross','Perry','Powell','Russell','Jenkins','Barnes','Fisher','Simmons'];
var SAMPLE_SCENES=['phone','chats','shift','lunch','bus','gym','street','family'];
function mkEntry(i,complete,missingKind){
  var special=[['Marcus','Lee'],['Jordan','Lee'],['Priya','Shah']],first=i<3?special[i][0]:FN[i%FN.length],last=i<3?special[i][1]:LN[i%LN.length],area=['312','773','630','847','708'][Math.floor(i/100)%5],phone=area+'55501'+String(i%100).padStart(2,'0');
  var sc=SAMPLE_SCENES[i%SAMPLE_SCENES.length],t=sceneById(sc).tag;
  var e={id:st.nextId++,first:first,last:last,phone:phone,handle:(first+'.'+last+(i>=30?i:'')).toLowerCase(),platform:PLATFORMS[i%7],otherApp:'',tags:t?[t]:[],notes:'',scene:sc,created:Date.now()-(200-i)*3600e3,completedAt:null,removed:false,heldOf:null,keptWith:[],chain:false,sample:true};
  if(!complete){if(missingKind==='phone')e.phone='';else if(missingKind==='two'){e.phone='';e.last='';}else{e.handle='';e.platform='';}}
  else e.completedAt=e.created+60e3;
  return e;
}
function grantFor(e){st.xpKeys['cc:'+personKey(e)]=1;st.xp+=10;}
function settleMilestones(){var c=count();for(var i=0;i<MS.length;i++){var m=MS[i];if(c>=m&&!st.ms[m]&&m<100){st.ms[m]=Date.now();st.xpKeys['ms:'+m]=1;st.xp+=MS_XP[m];st.cos[m]=true;}}st.levelName=level().name;}
function loadSample(){
  st=fresh();st.ack=true;st.sample=true;
  for(var i=0;i<42;i++){var e=mkEntry(i,true);st.entries.push(e);grantFor(e);}
  var kinds=['phone','phone','handle','phone','two','phone'];for(var j=0;j<6;j++)st.entries.push(mkEntry(42+j,false,kinds[j]));
  var dup=mkEntry(1,true);dup.handle='jordan.lee.2';dup.platform='Snapchat';dup.created=Date.now()-3600e3;dup.completedAt=null;dup.heldOf=st.entries[1].id;st.entries.push(dup);
  ['phone','chats','shift','lunch'].forEach(function(s){if(sceneStats(s).lit>=sceneById(s).clears){st.scenes[s]={cleared:true};st.xpKeys['sc:'+s]=1;st.xp+=15;}});
  st.badges.reader=Date.now();st.lastScene='gym';
  var d=function(n){return Date.now()-n*864e5;};
  st.referrals=[
   {id:'r1',name:'Marcus Lee',status:'progress',checks:[{on:true,by:'Dana',at:d(9)},{on:true,by:'Dana',at:d(6)},{on:false},{on:false}]},
   {id:'r2',name:'Priya Shah',status:'ready',checks:[{on:true,by:'Dana',at:d(20)},{on:true,by:'Dana',at:d(16)},{on:true,by:'Dana',at:d(12)},{on:true,by:'Dana',at:d(8)}]}
  ];
  settleMilestones();save();closeSheet();toast('Sample list loaded','win');go('home');
}
function jumpTo99(){
  if(!st.ack)st.ack=true;st.sample=true;
  var i=500;while(count()<99){var e=mkEntry(i++,true);e.handle=(e.first+'.'+e.last+'.'+i).toLowerCase();e.created=Date.now()-(1000-i)*60e3;e.completedAt=e.created+30e3;st.entries.push(e);if(findDup(e)){e.phone=String(200+i)+'5550'+String(i%1000).padStart(3,'0');}grantFor(e);}
  var hasOneAway=drafts().some(function(x){return missing(x).length===1&&missing(x)[0]==='Phone';});
  if(!hasOneAway){var dft=mkEntry(i++,false,'phone');dft.first='Sofia';dft.last='Castillo';dft.handle='sofia.castillo.'+i;st.entries.push(dft);}
  settleMilestones();save();closeSheet();toast('Jumped to 99. Finish one draft to hit 100.','win');go('home');
}
function demoApprove(){
  var any=false;if(st.reward.status==='ready'&&count()>=100){st.reward.status='approved';st.reward.approvedAt=Date.now();any=true;}
  st.referrals.forEach(function(x){if(x.status==='ready'||(x.status==='progress'&&x.checks.every(function(k){return k.on;}))){x.status='approved';x.approvedAt=Date.now();any=true;}});
  save();closeSheet();
  if(!any){toast('Nothing ready to approve. Reach 100 first, or load the sample list.');return;}
  queueCele({stamp:true,title:'Approved by your leader',sub:'$100 · Pending pay'});go('rewards');
}
function demoPay(){
  var any=false;if(st.reward.status==='approved'){st.reward.status='paid';st.reward.paidAt=Date.now();any=true;}
  st.referrals.forEach(function(x){if(x.status==='approved'){x.status='paid';x.paidAt=Date.now();any=true;}});
  save();closeSheet();
  if(!any){toast('Nothing is pending pay yet.');return;}
  queueCele({check:true,title:'Pay issued',sub:fmtDate(Date.now())});go('rewards');
}

/* ---------- actions ---------- */
var A={
 'tab':function(b){go(b.dataset.k);},
 'back':function(b){go(b.dataset.to||'home');},
 'scene-open':function(b){go('dropin',{sid:b.dataset.sid});},
 'locked':function(){toast('Unlocks at 20 complete contacts');},
 'sprint-start':function(b){startSprint(b.dataset.sid,'timed');},

 'sp-done':function(){if(!sp)return go('scenes');if(!sp.names.length){go('scenes');return;}if(sp.timer){clearInterval(sp.timer);sp.timer=null;}sp.ended=true;showEndSheet();},
 'sp-light':function(){var sid=sp.sid;go('sweep',{queue:sweepIds(sid),i:0,sid:sid});},

 'sp-chip':function(b){sp.pinned=b.dataset.q;renderPinned();try{document.getElementById('spInput').focus();}catch(e){}},
 'sp-unpin':function(){sp.pinned=null;renderPinned();},
 'sp-dead':function(){deadEnd();},
 'sp-switch':function(b){startSprint(b.dataset.sid,sp?sp.mode:'timed');},
 'sp-stay':function(){document.getElementById('cueBox').innerHTML='';try{document.getElementById('spInput').focus();}catch(e){}},
 'sweep-all':function(){go('sweep',{queue:sweepIds(null),i:0,sid:null});},
 'sw-skip':function(){view.p.i++;render();},
 'dup-same':function(b){resolveSame(Number(b.dataset.id));},
 'dup-diff':function(b){openDiffSheet(Number(b.dataset.id));},
 'dup-diff-ok':function(b){resolveDiff(Number(b.dataset.id));},
 'dup-fix':function(b){go('contact',{id:Number(b.dataset.id),from:'network'});},
 'plat':function(b){var f=document.getElementById('cForm');f.dataset.platform=b.dataset.v;Array.prototype.forEach.call(f.querySelectorAll('[data-a="plat"]'),function(x){x.classList.toggle('on',x===b);});var ow=document.getElementById('otherWrap');if(ow)ow.hidden=b.dataset.v!=='Other';var eh=document.getElementById('eHandle');if(eh)eh.textContent='';updateLeft();},
 'tag':function(b){b.classList.toggle('on');},
 'c-save':function(){contactSave(false);},
 'c-remove':function(b){var e=byId(Number(b.dataset.id));var n=counted(e)?count()-1:count();openSheet('<h2>Remove '+esc(fullName(e))+'?</h2><p class="muted">Your count will '+(counted(e)?'drop to '+Math.min(n,100):'stay at '+Math.min(n,100))+'. XP is never earned twice. The RALLY recruiting team keeps the record.</p><div class="row"><button class="btn" data-a="sheet-close">Keep</button><button class="btn danger" data-a="c-remove-ok" data-id="'+e.id+'">Remove</button></div>');},

 'net-filter':function(b){view.p.f=b.dataset.v;render();},
 'net-open':function(b){go('contact',{id:Number(b.dataset.id),from:'network'});},
 'net-add':function(){go('contact',{id:null,from:'network'});},
 'wall':function(){go('network');},
 'congrats':function(){go('congrats',{});},
 'intro-stub':function(){openSheet('<h2>Introductions</h2><p class="muted">Introductions come in the next build stage. In the real app this opens a search of your complete contacts so you can mark who you introduced.</p><button class="btn" data-a="sheet-close">Got it</button>');},
 'proto':function(){openProto();},
 'p-sample':function(){loadSample();},
 'p-jump':function(){jumpTo99();},
 'p-approve':function(){demoApprove();},

 'p-congrats':function(){closeSheet();go('congrats',{});},
 'p-rm':function(){st.rm=!st.rm;save();render();openProto();},
 'p-reset':function(){openSheet('<h2>Reset everything?</h2><p class="muted">This clears the prototype on this phone, including the onboarding.</p><div class="row"><button class="btn" data-a="sheet-close">Cancel</button><button class="btn danger" data-a="p-reset-ok">Reset</button></div>');},
 'p-reset-ok':function(){st=fresh();save();closeSheet();go('onboarding',{step:0});},
 'sheet-close':function(){closeSheet();},
 'ob-next':function(){view.p.step=(view.p.step||0)+1;render();},
 'ob-back':function(){view.p.step=Math.max(0,(view.p.step||0)-1);render();},
 'ob-go':function(){if(!view.p.ack){var r=document.getElementById('ackRow');if(r){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');}var h=document.getElementById('ackHint');if(h)h.textContent='Check the box to continue.';return;}st.ack=true;st.ackAt=Date.now();save();go('home');}
};
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var f=A[b.dataset.a];if(!f)return;ev.preventDefault();f(b,ev);});
render();
})();
