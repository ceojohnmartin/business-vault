<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian is now RALLY</title>
<meta name="theme-color" content="#F5F7FB">
<meta http-equiv="refresh" content="0;url=../rally/">
<style>
  body{font-family:'Outfit','Helvetica Neue',Arial,sans-serif;background:#F5F7FB;color:#101828;
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
  a{color:#0A6CF0;font-weight:700}
</style>
</head>
<body>
<p>Meridian is now <b>RALLY</b>.<br>Taking you there — or <a href="../rally/">tap here</a>.<br>
<span style="font-size:13px;color:#667085">Add the new RALLY app to your home screen; all your customers and pins carry over.</span></p>
<script>
  // retire ONLY the old Meridian service worker (scope-matched) so this
  // redirect always wins — RALLY's own SW at /rally/ must survive
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) {
        if ((r.scope || "").indexOf("/meridian") !== -1) r.unregister();
      });
    }).catch(function () {});
  }
  location.replace("../rally/");
</script>
</body>
</html>
